{% extends "base.html" %}
{% block title %}{{ title }} - SELOEDU{% endblock %}

{% block content %}
<div class="form-wrap">
  <h1>{{ title }}</h1>
  <form method="POST" action="{{ action_url }}">
    <label for="nome">Nome</label>
    <input id="nome" name="nome" value="{{ form_data.nome }}" required>

    <label for="email">E-mail</label>
    <input id="email" type="email" name="email" value="{{ form_data.email }}" required>

    <label for="cargo">Cargo</label>
    <input id="cargo" name="cargo" value="{{ form_data.cargo }}" required>

    <label for="telefone">Telefone</label>
    <input id="telefone" name="telefone" value="{{ form_data.telefone }}">

    <label for="status">Status</label>
    <select id="status" name="status">
      {% for item in status_choices %}
      <option value="{{ item }}" {% if form_data.status == item %}selected{% endif %}>{{ item }}</option>
      {% endfor %}
    </select>

    <label for="data_admissao">Data de admissao</label>
    <input id="data_admissao" type="date" name="data_admissao" value="{{ form_data.data_admissao }}">

    <div class="actions">
      <a class="btn-small" href="{{ url_for('funcionarios.listar') }}">Cancelar</a>
      <button type="submit">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}
