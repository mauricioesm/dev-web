<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Treinamento</title>
</head>
<body>
    <div>
        <form action="{{url_for('treinamento.modificar', id=id_treinamento)}}" method="POST">
            <label for="">Disciplina</label>
            <input type="text" name="disciplina" id="disciplina" value="{{treinamento.disciplina}}">
            <label for="">Carga Horaria</label>
            <input type="text" name="carga_horaria" id="carga_horaria" value="{{treinamento.carga_horaria}}">
            <label for="">Capacidade</label>
            <input type="text" name="capacidade" id="capacidade" value="{{treinamento.capacidade}}">
            <button type="submit">Salvar</button>
        </form>
    </div>
</body>
</html>
