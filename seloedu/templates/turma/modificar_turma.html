<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar turma</title>
</head>
<body>
    <div>
        <form action="{{url_for('turma.modificar', id=id_turma)}}" method="POST">
            <label for="">Quantidade de Funcionários</label>
            <input type="number" name="qtd_funcionarios" id="qtd_funcionarios" value="{{turma.qtd_funcionarios}}">
            <button type="submit">Salvar</button>
        </form>
    </div>
</body>
</html>
