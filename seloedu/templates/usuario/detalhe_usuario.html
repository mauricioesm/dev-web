{% extends "base.html" %}

{% block title %}Usuario #{{ usuario.id }} - SELOEDU{% endblock %}

{% block content %}
<div class="detail-page">
  <div class="header-row">
    <div>
      <h1>{{ usuario.nome }}</h1>
      <p>{{ usuario.email }}</p>
    </div>
    <div class="actions-cell">
      <a class="btn-small" href="{{ url_for('usuario.listar') }}">Voltar</a>
      <a class="primary-btn" href="{{ url_for('usuario.editar', id=usuario.id) }}">Editar</a>
    </div>
  </div>

  <section class="detail-card">
    <p><strong>ID:</strong> {{ usuario.id }}</p>
    <p><strong>Nome:</strong> {{ usuario.nome }}</p>
    <p><strong>E-mail:</strong> {{ usuario.email }}</p>
    <p><strong>Perfil:</strong> {{ usuario.funcao }}</p>
  </section>
</div>
{% endblock %}
