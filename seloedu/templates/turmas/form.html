{% extends "base.html" %}
{% block title %}{{ title }} - SELOEDU{% endblock %}

{% block content %}
<div class="form-wrap">
  <h1>{{ title }}</h1>
  <form method="POST" action="{{ action_url }}">
    <label for="nome">Nome da turma</label>
    <input id="nome" name="nome" value="{{ form_data.nome }}" required>

    <label for="treinamento_id">Treinamento</label>
    <select id="treinamento_id" name="treinamento_id" required>
      <option value="">Selecione</option>
      {% for treinamento in treinamentos %}
      <option value="{{ treinamento.id }}" {% if form_data.treinamento_id|string == treinamento.id|string %}selected{% endif %}>{{ treinamento.titulo }}</option>
      {% endfor %}
    </select>

    <label for="vagas">Vagas</label>
    <input id="vagas" type="number" min="1" name="vagas" value="{{ form_data.vagas }}" required>

    <label for="data_inicio">Data de inicio</label>
    <input id="data_inicio" type="date" name="data_inicio" value="{{ form_data.data_inicio }}">

    <label for="data_fim">Data de encerramento</label>
    <input id="data_fim" type="date" name="data_fim" value="{{ form_data.data_fim }}">

    <label for="status">Status</label>
    <select id="status" name="status">
      {% for item in status_choices %}
      <option value="{{ item }}" {% if form_data.status == item %}selected{% endif %}>{{ item }}</option>
      {% endfor %}
    </select>

    <div class="actions">
      <a class="btn-small" href="{{ url_for('turmas.listar') }}">Cancelar</a>
      <button type="submit">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}
